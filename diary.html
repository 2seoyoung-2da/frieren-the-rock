<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegan Delights - 머핀 카페</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Markazi+Text:wght@400;500;600;700&family=Newsreader:wght@400;500;600;700&family=Cactus+Classical+Serif:wght@400;500;600;700&family=Nanum+Brush+Script&family=Caveat:wght@400;500;600;700&family=Indie+Flower&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="site-header"></div>

    <!-- Diary Section -->
    <main class="diary-page">
        <div class="diary-container">
            <h2 class="diary-title">M.Diary</h2>
            
            <!-- Calendar Section -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <button class="calendar-nav prev-month">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h3 class="current-month">
                        <span class="month-number">08</span>
                        <div class="month-text">
                            <span class="month-name">August</span>
                            <span class="month-year">2025</span>
                        </div>
                    </h3>
                    <button class="calendar-nav next-month">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                
                <div class="calendar">
                    <div class="calendar-weekdays">
                        <div class="weekday">SUN</div>
                        <div class="weekday">MON</div>
                        <div class="weekday">TUE</div>
                        <div class="weekday">WED</div>
                        <div class="weekday">THU</div>
                        <div class="weekday">FRI</div>
                        <div class="weekday">SAT</div>
                    </div>
                    
                    <div class="calendar-days" id="calendarDays">
                        <!-- Calendar days will be generated by JavaScript -->
                    </div>
                </div>
            </div>
            
            <!-- Upload Section -->
            <div class="upload-section">
                <div class="password-form" id="passwordForm">
                    <h3>Upload</h3>
                    <div class="password-row">
                        <input type="password" id="adminPassword" placeholder="password" />
                        <button id="passwordSubmit">확인</button>
                    </div>
                </div>
                
                <div class="upload-form" id="uploadForm" style="display: none;">
                    <h3>일기 업로드</h3>
                    <div class="upload-controls">
                        <input type="date" id="diaryDate" />
                        <div class="file-upload-group">
                            <label for="imageUpload">일기 사진:</label>
                            <input type="file" id="imageUpload" accept="image/*" />
                        </div>
                        <div class="file-upload-group">
                            <label for="thumbnailUpload">썸네일 사진:</label>
                            <input type="file" id="thumbnailUpload" accept="image/*" />
                        </div>
                        <textarea id="diaryCaption" placeholder="일기 내용을 입력하세요..."></textarea>
                        <button id="uploadSubmit">업로드</button>
                        <button id="logoutBtn">로그아웃</button>
                    </div>
                </div>
            </div>
            
            <!-- Diary Content Section -->
            <div class="diary-content">
                <div class="diary-date">
                    <h3 id="selectedDate">August 1, 2025</h3>
                </div>
                <div class="diary-text">
                    <p id="diaryText">오늘은 새로운 레몬 머핀 레시피를 시도해봤어요. 고객님들이 정말 좋아해주셨네요! 특히 김씨 부부께서는 "정말 맛있어요"라고 말씀해주셔서 기분이 좋았습니다. 내일은 베리베리 머핀도 만들어볼까 해요.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="./js/header.js"></script>
    <script src="./js/script.js"></script>
    <script>
        // Calendar functionality
        document.addEventListener('DOMContentLoaded', function() {
            let currentDate = new Date();
            let selectedDate = new Date();
            
            const calendarDays = document.getElementById('calendarDays');
            const currentMonthEl = document.querySelector('.current-month');
            const selectedDateEl = document.getElementById('selectedDate');
            const diaryTextEl = document.querySelector('.diary-text');
            
            // Admin password (실제 사용시 더 복잡한 비밀번호로 변경)
            const ADMIN_PASSWORD = 'frieren2025';
            
            // Password form elements
            const passwordForm = document.getElementById('passwordForm');
            const uploadForm = document.getElementById('uploadForm');
            const adminPasswordInput = document.getElementById('adminPassword');
            const passwordSubmitBtn = document.getElementById('passwordSubmit');
            const logoutBtn = document.getElementById('logoutBtn');
            
            // Upload form elements
            const diaryDateInput = document.getElementById('diaryDate');
            const imageUploadInput = document.getElementById('imageUpload');
            const thumbnailUploadInput = document.getElementById('thumbnailUpload');
            const diaryCaptionInput = document.getElementById('diaryCaption');
            const uploadSubmitBtn = document.getElementById('uploadSubmit');
            
            // Load diary entries from localStorage
            function loadDiaryEntries() {
                const saved = localStorage.getItem('diaryEntries');
                return saved ? JSON.parse(saved) : {};
            }
            
            // Save diary entries to localStorage
            function saveDiaryEntries(entries) {
                localStorage.setItem('diaryEntries', JSON.stringify(entries));
            }
            
            // Get current diary entries
            let diaryEntries = loadDiaryEntries();
            
            // Sample diary entries (fallback)
            const sampleEntries = {
                '2025-08-01': '오늘은 새로운 레몬 머핀 레시피를 시도해봤어요. 고객님들이 정말 좋아해주셨네요!',
                '2025-08-02': '오늘은 정말 바쁜 하루였어요. 주말이라 손님이 많으셨는데, 모두 만족해주셔서 다행이에요.',
                '2025-08-03': '새로운 고객님이 오셨어요. 티라미수 머핀을 드시고 정말 맛있다고 하셨는데, 이런 순간이 가장 행복해요.'
            };
            
            function renderCalendar(date) {
                const year = date.getFullYear();
                const month = date.getMonth();
                
                currentMonthEl.querySelector('.month-number').textContent = (month + 1).toString().padStart(2, '0');
                currentMonthEl.querySelector('.month-name').textContent = getMonthName(month);
                currentMonthEl.querySelector('.month-year').textContent = year;
                
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay());
                
                calendarDays.innerHTML = '';
                
                for (let i = 0; i < 42; i++) {
                    const dayDate = new Date(startDate);
                    dayDate.setDate(startDate.getDate() + i);
                    
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-day';
                    
                    if (dayDate.getMonth() === month) {
                        dayElement.classList.add('current-month-day');
                    }
                    
                    if (dayDate.toDateString() === selectedDate.toDateString()) {
                        dayElement.classList.add('selected');
                    }
                    
                    const dayNumber = document.createElement('div');
                    dayNumber.textContent = dayDate.getDate();
                    dayElement.appendChild(dayNumber);
                    
                    if (diaryEntries[formatDate(dayDate)]) {
                        dayElement.classList.add('has-entry');
                        
                        // Add thumbnail image
                        const thumbnail = document.createElement('img');
                        thumbnail.src = diaryEntries[formatDate(dayDate)].thumbnailUrl || diaryEntries[formatDate(dayDate)].imageUrl;
                        thumbnail.className = 'day-thumbnail';
                        thumbnail.alt = 'Diary image';
                        thumbnail.onload = function() {
                            console.log('Thumbnail loaded for date:', formatDate(dayDate));
                        };
                        thumbnail.onerror = function() {
                            console.log('Thumbnail failed to load for date:', formatDate(dayDate));
                        };
                        dayElement.appendChild(thumbnail);
                    }
                    
                    dayElement.addEventListener('click', () => selectDate(dayDate));
                    
                    calendarDays.appendChild(dayElement);
                }
            }
            
            function selectDate(date) {
                selectedDate = date;
                selectedDateEl.textContent = formatDateForDisplay(date);
                
                const entry = diaryEntries[formatDate(date)];
                if (entry) {
                    if (entry.imageUrl) {
                        diaryTextEl.innerHTML = `
                            <div class="diary-image">
                                <img src="${entry.imageUrl}" alt="Diary image" />
                            </div>
                            <p>${entry.caption || ''}</p>
                        `;
                    } else {
                        diaryTextEl.innerHTML = `<p>${entry}</p>`;
                    }
                } else {
                    diaryTextEl.innerHTML = '<p>이 날은 아직 일기가 없어요.</p>';
                }
                
                renderCalendar(currentDate);
            }
            
            function formatDate(date) {
                return date.toISOString().split('T')[0];
            }
            
            function formatDateForDisplay(date) {
                const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                               'July', 'August', 'September', 'October', 'November', 'December'];
                return `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
            }
            
            function getMonthName(month) {
                const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                               'July', 'August', 'September', 'October', 'November', 'December'];
                return months[month];
            }
            
            // Password authentication
            passwordSubmitBtn.addEventListener('click', () => {
                if (adminPasswordInput.value === ADMIN_PASSWORD) {
                    passwordForm.style.display = 'none';
                    uploadForm.style.display = 'block';
                    adminPasswordInput.value = '';
                } else {
                    alert('비밀번호가 틀렸습니다.');
                    adminPasswordInput.value = '';
                }
            });
            
            // Logout
            logoutBtn.addEventListener('click', () => {
                uploadForm.style.display = 'none';
                passwordForm.style.display = 'block';
                // Clear form
                diaryDateInput.value = '';
                imageUploadInput.value = '';
                thumbnailUploadInput.value = '';
                diaryCaptionInput.value = '';
            });
            
            // Upload functionality
            uploadSubmitBtn.addEventListener('click', () => {
                const date = diaryDateInput.value;
                const imageFile = imageUploadInput.files[0];
                const thumbnailFile = thumbnailUploadInput.files[0];
                const caption = diaryCaptionInput.value;
                
                if (!date || !imageFile) {
                    alert('날짜와 일기 사진을 모두 선택해주세요.');
                    return;
                }
                
                // Convert main image to base64
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    let thumbnailUrl = imageUrl; // Default to main image if no thumbnail
                    
                    // If thumbnail is provided, convert it too
                    if (thumbnailFile) {
                        const thumbnailReader = new FileReader();
                        thumbnailReader.onload = function(thumbE) {
                            thumbnailUrl = thumbE.target.result;
                            saveDiaryEntry(date, imageUrl, thumbnailUrl, caption);
                        };
                        thumbnailReader.readAsDataURL(thumbnailFile);
                    } else {
                        saveDiaryEntry(date, imageUrl, thumbnailUrl, caption);
                    }
                };
                reader.readAsDataURL(imageFile);
            });
            
            function saveDiaryEntry(date, imageUrl, thumbnailUrl, caption) {
                // Save to diary entries
                diaryEntries[date] = {
                    imageUrl: imageUrl,
                    thumbnailUrl: thumbnailUrl,
                    caption: caption,
                    uploadDate: new Date().toISOString()
                };
                
                saveDiaryEntries(diaryEntries);
                
                // Refresh calendar
                renderCalendar(currentDate);
                
                // Clear form
                diaryDateInput.value = '';
                imageUploadInput.value = '';
                thumbnailUploadInput.value = '';
                diaryCaptionInput.value = '';
                
                alert('일기가 성공적으로 업로드되었습니다!');
            }
            
            // Set today's date as default
            diaryDateInput.value = new Date().toISOString().split('T')[0];
            
            // Navigation buttons
            document.querySelector('.prev-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar(currentDate);
            });
            
            document.querySelector('.next-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar(currentDate);
            });
            
            // Initialize calendar
            renderCalendar(currentDate);
            selectDate(new Date());
        });
    </script>
</body>
</html>
